backend:
  name: github
  repo: Antogeek2030/chester-waterproofing
  branch: main

media_folder: chester-waterproofing/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: chester-waterproofing/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Description (SEO), name: description, widget: string }
      - { label: Body, name: body, widget: markdown }
