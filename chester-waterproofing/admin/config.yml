backend:
  name: github
  repo: Antogeek2030/chester-waterproofing
  branch: main
  base_url: https://sveltia-cms-auth.sveltia-cms-auth.okutoantony21.workers.dev

media_folder: chester-waterproofing/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: chester-waterproofing/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
